[package]
name = "zuno-ui-vizia"
version = "0.1.0"
edition = "2021"
description = "Zuno benchmark UI — vizia (gui/vizia branch)"
license = "Apache-2.0"

[[bin]]
name = "zuno-vizia"
path = "src/main.rs"

[dependencies]
zuno-core = { path = "../core" }
zuno-yt = { path = "../yt" }
vizia = "0.4.0"
png = "0.17"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }
