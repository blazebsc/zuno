[package]
name = "zuno-ui-slint"
version = "0.1.0"
edition = "2021"
description = "Zuno benchmark UI — Slint (gui/slint branch)"
license = "Apache-2.0"

[[bin]]
name = "zuno-slint"
path = "src/main.rs"

[dependencies]
zuno-core = { path = "../core" }
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-18"] }

[build-dependencies]
slint-build = "1"
