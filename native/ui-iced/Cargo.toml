[package]
name = "zuno-ui-iced"
version = "0.1.0"
edition = "2021"
description = "Zuno benchmark UI — iced (gui/iced branch)"
license = "Apache-2.0"

[[bin]]
name = "zuno-iced"
path = "src/main.rs"

[dependencies]
zuno-core = { path = "../core" }
iced = { version = "0.14", features = ["image", "canvas", "tokio", "svg", "lazy"] }